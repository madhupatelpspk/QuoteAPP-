<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MADHU PATEL</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#000;
    color:#fff;
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #222;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:700;
    letter-spacing:1px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

.post-box{
    background:#111;
    border:1px solid #222;
    border-radius:20px;
    padding:18px;
    margin-bottom:20px;
}

textarea{
    width:100%;
    background:transparent;
    border:none;
    color:white;
    font-size:16px;
    resize:none;
    min-height:120px;
    outline:none;
}

.post-btn{
    margin-top:15px;
    background:white;
    color:black;
    border:none;
    padding:12px 24px;
    border-radius:30px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.post-btn:hover{
    transform:scale(1.05);
}

.feed{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.card{
    background:#111;
    border:1px solid #222;
    border-radius:20px;
    padding:20px;
    animation:fadeUp .5s ease;
    transition:.3s;
    position:relative;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#444;
}

.quote{
    font-size:18px;
    line-height:1.7;
}

.time{
    margin-top:12px;
    color:#777;
    font-size:13px;
}

.actions{
    margin-top:15px;
    display:flex;
    gap:20px;
    color:#888;
}

.actions span{
    cursor:pointer;
    transition:.3s;
}

.actions span:hover{
    color:white;
}

.delete-btn{
    position:absolute;
    top:10px;
    right:10px;
    background:transparent;
    border:none;
    color:#888;
    cursor:pointer;
    font-size:18px;
    transition:.3s;
}

.delete-btn:hover{
    color:#ff4444;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:600px){
    .container{
        padding:15px;
    }

    .quote{
        font-size:16px;
    }
}
</style>
</head>

<body>

<header>
✨ Madhu Patel 
</header>

<div class="container">

<div class="post-box">
<textarea id="quoteInput" placeholder="What's on your mind today?"></textarea>
<button class="post-btn" onclick="addQuote()">Post Quote</button>
</div>

<div class="feed" id="feed">

</div>

</div>

<script>

// Load quotes from localStorage on page load
function loadQuotes(){
    let quotes = JSON.parse(localStorage.getItem("quotes")) || [];
    quotes.forEach(quote => {
        renderQuote(quote);
    });
}

// Render a quote to the DOM
function renderQuote(quote){
    let card = document.createElement("div");
    card.className = "card";
    card.dataset.id = quote.id;
    
    card.innerHTML = `
        <button class="delete-btn" onclick="deleteQuote(${quote.id})">✕</button>
        <div class="quote">"${quote.text}"</div>
        <div class="time">${quote.time}</div>
        <div class="actions">
            <span>❤️ 0</span>
            <span>💬 0</span>
            <span>🔁 0</span>
        </div>
    `;
    
    document.getElementById("feed").prepend(card);
}

// Add a new quote
function addQuote(){
    let input = document.getElementById("quoteInput");
    let text = input.value.trim();
    
    if(text === "") return;
    
    // Create quote object
    let quote = {
        id: Date.now(),
        text: text,
        time: new Date().toLocaleString()
    };
    
    // Get existing quotes from localStorage
    let quotes = JSON.parse(localStorage.getItem("quotes")) || [];
    
    // Add new quote to array
    quotes.unshift(quote);
    
    // Save back to localStorage
    localStorage.setItem("quotes", JSON.stringify(quotes));
    
    // Render on page
    renderQuote(quote);
    
    // Clear input
    input.value = "";
}

// Delete a quote
function deleteQuote(id){
    if(confirm("Are you sure you want to delete this quote?")){
        // Remove from DOM
        document.querySelector(`[data-id="${id}"]`).remove();
        
        // Remove from localStorage
        let quotes = JSON.parse(localStorage.getItem("quotes")) || [];
        quotes = quotes.filter(q => q.id !== id);
        localStorage.setItem("quotes", JSON.stringify(quotes));
    }
}

// Load quotes when page loads
window.addEventListener("load", loadQuotes);

</script>

</body>
</html>

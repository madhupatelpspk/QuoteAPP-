<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MADHU PATEL</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#000;
    color:#fff;
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #222;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:700;
    letter-spacing:1px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

.post-box{
    background:#111;
    border:1px solid #222;
    border-radius:20px;
    padding:18px;
    margin-bottom:20px;
}

textarea{
    width:100%;
    background:transparent;
    border:none;
    color:white;
    font-size:16px;
    resize:none;
    min-height:120px;
    outline:none;
}

.post-btn{
    margin-top:15px;
    background:white;
    color:black;
    border:none;
    padding:12px 24px;
    border-radius:30px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.post-btn:hover{
    transform:scale(1.05);
}

.post-btn:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

.feed{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.card{
    background:#111;
    border:1px solid #222;
    border-radius:20px;
    padding:20px;
    animation:fadeUp .5s ease;
    transition:.3s;
    position:relative;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#444;
}

.quote{
    font-size:18px;
    line-height:1.7;
}

.author{
    margin-top:8px;
    color:#999;
    font-size:12px;
}

.time{
    margin-top:12px;
    color:#777;
    font-size:13px;
}

.actions{
    margin-top:15px;
    display:flex;
    gap:20px;
    color:#888;
}

.actions span{
    cursor:pointer;
    transition:.3s;
}

.actions span:hover{
    color:white;
}

.delete-btn{
    position:absolute;
    top:10px;
    right:10px;
    background:transparent;
    border:none;
    color:#888;
    cursor:pointer;
    font-size:18px;
    transition:.3s;
}

.delete-btn:hover{
    color:#ff4444;
}

.loading{
    text-align:center;
    color:#777;
    padding:20px;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:600px){
    .container{
        padding:15px;
    }

    .quote{
        font-size:16px;
    }
}
</style>
</head>

<body>

<header>
✨ Madhu Patel - Shared Quotes
</header>

<div class="container">

<div class="post-box">
<textarea id="quoteInput" placeholder="What's on your mind today?"></textarea>
<button class="post-btn" id="postBtn" onclick="addQuote()">Post Quote</button>
</div>

<div class="feed" id="feed">
<div class="loading">Loading quotes...</div>
</div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>

<script>

// TODO: Replace with your Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyD1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    authDomain: "your-project.firebaseapp.com",
    databaseURL: "https://your-project.firebaseio.com",
    projectId: "your-project",
    storageBucket: "your-project.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdefghijklmnopqr"
};

// Initialize Firebase
const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database(app);

// Reference to quotes in database
const quotesRef = db.ref("quotes");

// Load quotes from Firebase on page load
function loadQuotes(){
    const feed = document.getElementById("feed");
    feed.innerHTML = '<div class="loading">Loading quotes...</div>';
    
    quotesRef.orderByChild("timestamp").limitToLast(50).on("value", (snapshot) => {
        feed.innerHTML = "";
        
        if(!snapshot.exists()){
            feed.innerHTML = '<div class="loading">No quotes yet. Be the first to share!</div>';
            return;
        }
        
        const quotes = [];
        snapshot.forEach((childSnapshot) => {
            quotes.push({
                id: childSnapshot.key,
                ...childSnapshot.val()
            });
        });
        
        // Display in reverse order (newest first)
        quotes.reverse().forEach(quote => {
            renderQuote(quote);
        });
    });
}

// Render a quote to the DOM
function renderQuote(quote){
    let card = document.createElement("div");
    card.className = "card";
    card.dataset.id = quote.id;
    
    card.innerHTML = `
        <button class="delete-btn" onclick="deleteQuote('${quote.id}')">✕</button>
        <div class="quote">"${quote.text}"</div>
        <div class="author">~ ${quote.author || "Anonymous"}</div>
        <div class="time">${new Date(quote.timestamp).toLocaleString()}</div>
        <div class="actions">
            <span>❤️ ${quote.likes || 0}</span>
            <span>💬 ${quote.comments || 0}</span>
            <span>🔁 ${quote.shares || 0}</span>
        </div>
    `;
    
    document.getElementById("feed").prepend(card);
}

// Add a new quote
function addQuote(){
    let input = document.getElementById("quoteInput");
    let text = input.value.trim();
    let btn = document.getElementById("postBtn");
    
    if(text === "") return;
    
    btn.disabled = true;
    btn.textContent = "Posting...";
    
    // Create quote object
    let quote = {
        text: text,
        author: "Anonymous",
        timestamp: Date.now(),
        likes: 0,
        comments: 0,
        shares: 0
    };
    
    // Push to Firebase
    quotesRef.push(quote)
        .then(() => {
            input.value = "";
            btn.disabled = false;
            btn.textContent = "Post Quote";
        })
        .catch((error) => {
            console.error("Error posting quote:", error);
            alert("Failed to post quote. Check Firebase config.");
            btn.disabled = false;
            btn.textContent = "Post Quote";
        });
}

// Delete a quote
function deleteQuote(id){
    if(confirm("Are you sure you want to delete this quote?")){
        quotesRef.child(id).remove()
            .catch((error) => {
                console.error("Error deleting quote:", error);
                alert("Failed to delete quote");
            });
    }
}

// Load quotes when page loads
window.addEventListener("load", loadQuotes);

</script>

</body>
</html>
